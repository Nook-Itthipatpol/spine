<!DOCTYPE html>
<!--
  ============================================================================
  Spine Week — v8
  ============================================================================
  Lumbar hypolordosis + low spinal mobility. AS and Scheuermann's ruled out.

  WORKING RULES (ask Claude to follow these on every edit)
  ---------------------------------------------------------------------------
  1. VERSION EVERY FILE. Never save over the previous one. The working copy is
     `spine vNN.html`; NN goes up by one per round of changes, and the old file
     stays on disk so a regression can be bisected against it.
  2. The deployed file is a COPY named `index.html`. It is byte-identical to
     `spine vNN.html` — index.html is never edited directly, or the two
     silently drift.
  3. Write these rules into this comment in every version.
  4. Say what changed and why. A fix with no note becomes a mystery on the next
     pass.

  v8 — readability pass · exercise / Why / Tests only
  ---------------------------------------------------------------------------
  Reworked exercise Why/How/Watch-for copy plus the Why and Tests tabs for
  faster self-reading: Thai-English mixed more freely, biomechanics terms stay
  in English, and movement cues are more action-first. Removed only redundant
  wording. Sets/reps, progression rules, state logic, UI structure, and asset
  paths are unchanged.

  v7 — Thai copy / clarity pass
  ---------------------------------------------------------------------------
  Rewrote user-facing Thai explanations for shorter sentences, clearer movement
  cues, and consistent Thai-English clinical terminology. Exercise selection,
  sets/reps, progression rules, state logic, and asset paths are unchanged.

  v1 — first cut
  ---------------------------------------------------------------------------
  Design lifted wholesale from training v64: same tokens, same card model, same
  item row (box · name · dose · weight · ⓘ), same weekly rollover into year
  shards. What is different is the CONTENT MODEL, and it is different for one
  reason: this program is corrective, not progressive.

  A  The week tab holds three sessions, not seven. Two gym days and one optional
     leg day. The work that matters most is not on this tab at all — it is on
     Daily, because a motor-control pattern is trained by frequency, and
     10 minutes × 7 beats 45 minutes × 2 for that specific job.
  B  No deload toggle. There is nothing to deload from — the loads here are RPE
     6–7 by design and stay there. The toggle that replaces it is `slump`, which
     is a CLINICAL branch: a positive slump test changes what she should do to
     the hamstring, so it changes the plan rather than just the volume.
  C  The Tests tab exists because this program has an endpoint that is measured,
     not felt. Weight on the bar is not the outcome here; SLR angle and the RDL
     depth at which lordosis survives are.
  D  Phase is derived from a start date, not stored as a state you flip. Weeks
     1–4 are motor control, 5–12 are loading, 13+ is maintenance, and the banner
     says which one today is so the weight fields get read in context.
  ============================================================================
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JINJIN workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    /* "Midnight Dial", carried over unchanged from training v64. Numbers are the
       content, so they get the brass; everything else stays quiet. */
    --paper:#0A0C0F;
    --fill:linear-gradient(#13171D 0%,#0E1114 92%,#0B0D10 100%);
    --fill-done:linear-gradient(#0E1114,#0A0C0F);
    --edge:#FFFFFF3B;
    --edge2:#FFFFFF1C;
    --hair:.5;
    --ink:#CCD3D9;
    --muted:#8A959C;
    --dim:#616D75;
    --line:#FFFFFF12;
    --brass:#D6B27C;
    --brass2:#8E7549;
    --r:18px;
    --rc:10px;
    --s1:19px;
    --s2:15px;
    --s3:13px;
    --s4:11px;
    --sans:-apple-system,BlinkMacSystemFont,system-ui,"IBM Plex Sans Thai Looped",sans-serif;
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
    --tag:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --mono:var(--sans);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--paper);}
  body{
    margin:0 auto;max-width:560px;
    padding:18px 16px calc(48px + env(safe-area-inset-bottom));
    background:transparent;
    color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(88% 34% at 50% -6%,#2A3540 0%,rgba(42,53,64,0) 68%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:9;pointer-events:none;
    opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
  }
  .brand{position:relative;display:flex;align-items:center;justify-content:center;
    min-height:30px;padding:0 0 14px;}
  .bname{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.34em;
    text-transform:uppercase;color:var(--brass);opacity:.85;padding-left:4px;
  }
  .eyebrow{font-family:var(--mono);font-size:var(--s4);letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);font-weight:500;}

  /* ---------- tabs ---------- */
  .tabs{display:flex;margin:2px 2px 20px;border-bottom:1px solid var(--line);}
  .tab{
    flex:1;padding:0 0 12px;border:0;background:transparent;font:inherit;
    font-size:var(--s3);font-weight:500;letter-spacing:.02em;
    color:var(--dim);cursor:pointer;transition:color .18s;
  }
  .tl{position:relative;display:inline-block;}
  .tl::after{
    content:"";position:absolute;left:-6px;right:-6px;bottom:-13px;height:1.5px;border-radius:999px;
    background:linear-gradient(90deg,var(--brass2),var(--brass));
    transform:scaleX(0);transition:transform .22s cubic-bezier(.4,0,.2,1);
  }
  .tab[aria-selected="true"]{color:var(--ink);font-weight:600;}
  .tab[aria-selected="true"] .tl::after{transform:scaleX(1);}
  .pane{display:none;}
  .pane.on{display:block;}

  .weekbar{display:flex;align-items:center;gap:8px;padding:0 2px 12px;}
  .weekno{font-family:var(--mono);font-size:var(--s4);color:var(--dim);flex:1;letter-spacing:.04em;}
  .weekno b{color:var(--brass);font-weight:600;}

  /* ---------- day card ---------- */
  .day{
    position:relative;overflow:hidden;
    background:var(--fill);border:1px solid var(--line);
    border-top:0;border-bottom:0;border-radius:var(--r);
    margin-bottom:8px;transition:background .18s;
  }
  .day::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
    transform:scaleY(var(--hair));transform-origin:top;
    background:linear-gradient(90deg,transparent 8%,var(--edge) 24%,var(--edge) 76%,transparent 92%);}
  .day::before{content:"";position:absolute;left:0;right:0;bottom:0;height:1px;
    transform:scaleY(var(--hair));transform-origin:bottom;z-index:2;pointer-events:none;
    background:linear-gradient(90deg,transparent 12%,var(--edge2) 29%,var(--edge2) 71%,transparent 88%);}
  .day.done::before{opacity:.4;}
  .day.done{background:var(--fill-done);border-color:#FFFFFF08;border-top:0;border-bottom:0;}
  .day.done::after{opacity:.4;}
  .day.done .title{color:var(--dim);}
  .day.open{box-shadow:0 18px 40px -22px #000;}
  .day.today .title::after{
    content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--accent);vertical-align:middle;margin-left:7px;
    box-shadow:0 0 8px var(--accent);
  }
  .head{
    position:relative;display:flex;align-items:center;justify-content:center;
    width:100%;min-height:66px;padding:10px 46px;
    background:none;border:0;font:inherit;color:inherit;cursor:pointer;
    touch-action:manipulation;
  }
  .stk{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;
    transform:translateY(-6.5px);}
  .dow{font-family:var(--tag);font-size:10px;letter-spacing:.03em;text-transform:uppercase;
    color:var(--dim);font-weight:500;line-height:1.3;}
  .dow .sub{display:inline;font:inherit;letter-spacing:inherit;text-transform:inherit;
    color:inherit;white-space:nowrap;}
  .title{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.005em;
    line-height:1.2;text-align:center;}
  .chev{position:absolute;top:50%;right:16px;transform:translateY(-50%);
    width:16px;height:16px;color:var(--muted);transition:transform .2s;}
  .chev svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:3;}
  .day.open .chev{transform:translateY(-50%) rotate(180deg);}
  .prog{display:block;height:2px;background:none;}
  .prog i{display:block;height:100%;width:0%;border-radius:0 999px 999px 0;
    background:linear-gradient(90deg,var(--brass2),var(--brass));
    transition:width .25s cubic-bezier(.4,0,.2,1);}
  .body{display:none;padding:2px 0 14px;}
  .day.open .body{display:block;}

  /* ---------- item ---------- */
  .grp{padding:0 18px;}
  .sslab{
    font-size:var(--s4);letter-spacing:.2em;text-transform:uppercase;font-weight:500;
    color:var(--dim);margin:0;padding:14px 0 3px;
  }
  .sslab:empty{display:none;}
  .grphead{display:flex;align-items:center;gap:10px;padding:14px 0 3px;}
  .grphead .sslab{padding:0;}
  .grphead+.item{border-top:0;}
  .item.nobox{padding-left:34px;}
  .grp.now{position:relative;background:var(--tint);margin:6px 0;padding-bottom:6px;}
  .grp.now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1.5px;
    background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent),black 55%));}
  .grp.now .sslab{color:var(--accent);opacity:.7;}
  .day.done .grp.now{background:none;box-shadow:none;}
  .item{display:flex;align-items:center;gap:10px;padding:10px 0;min-height:52px;}
  .item+.item{border-top:1px solid #FFFFFF0A;}
  .sslab+.item{border-top:0;}
  .item.on .name{color:var(--muted);}
  .box{
    width:24px;height:24px;flex:none;padding:0;touch-action:manipulation;
    border:1px solid #FFFFFF24;border-radius:var(--rc);background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s;
  }
  .box svg{width:13px;height:13px;fill:none;stroke:#0A0C0D;stroke-width:3.2;opacity:0;transition:opacity .15s;}
  .box.on{background:var(--accent);border-color:var(--accent);}
  .box.on svg{opacity:1;}
  .txt{flex:1;min-width:0;}
  .name{font-size:var(--s2);font-weight:500;letter-spacing:-.008em;line-height:1.4;}
  .dose{font-size:var(--s4);color:var(--dim);margin-left:7px;white-space:nowrap;}
  .dosefull{font-size:var(--s4);color:var(--muted);margin:0 0 10px;letter-spacing:.01em;}
  .idet{
    width:22px;height:22px;flex:none;padding:0;border-radius:50%;margin-left:auto;
    border:1px solid #FFFFFF1A;background:transparent;color:var(--dim);
    font:inherit;font-size:11px;font-style:italic;line-height:1;cursor:pointer;touch-action:manipulation;
    display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s;
  }
  .item.det .idet{color:var(--accent);border-color:var(--accent);opacity:.9;}
  .drop{display:none;padding:0 8px 12px 34px;}
  .item.det + .drop{display:block;}
  .tagx{
    display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;
    background:var(--soft);color:var(--accent);
    font-size:var(--s4);font-weight:700;vertical-align:1px;
  }

  /* weight */
  .wtwrap{display:flex;align-items:baseline;gap:4px;flex:none;align-self:center;margin-left:auto;}
  .wtwrap+.idet{margin-left:0;}
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .wtin{
    width:52px;height:32px;padding:0 2px;text-align:center;
    border:1px solid #FFFFFF14;border-radius:var(--rc);background:#12161B;
    font:inherit;font-family:var(--mono);font-size:15px;color:var(--brass);
    outline:none;letter-spacing:-.01em;
    box-shadow:0 1px 2px #00000080 inset;
    transition:border-color .15s;
  }
  .wtin::placeholder{color:#4E5B60;}
  .wtin:focus{border-color:var(--brass2);}
  .unit{font-family:var(--mono);font-size:var(--s4);color:var(--dim);}

  /* disclosures */
  details{margin:2px 0 0 0;}
  summary{
    list-style:none;display:inline-block;cursor:pointer;padding:1px 0 3px;
    font-size:var(--s4);font-weight:400;color:var(--dim);letter-spacing:0;
    border-bottom:1px dotted #FFFFFF24;line-height:1.4;transition:color .15s;
  }
  summary::-webkit-details-marker{display:none;}
  details[open] summary{color:var(--muted);}
  .note{
    font-size:var(--s2);line-height:1.65;color:#AEB8BF;
    border-left:1px solid var(--line);padding:2px 0 2px 13px;margin:2px 0 4px;
  }
  .note b{font-weight:600;color:var(--ink);}
  .note .tl,.note .tn{margin:0 0 9px;}
  .note .tl:last-child,.note .tn:last-child{margin-bottom:0;}
  .note .lab{
    display:block;font-family:var(--mono);font-size:var(--s4);font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;color:var(--brass2);margin-bottom:4px;
  }
  .poseart{
    margin:16px 0 2px;padding:0;text-align:center;
  }
  .poseart img{
    display:block;width:min(100%,340px);height:auto;margin:0 auto;
    filter:invert(86%) sepia(8%) saturate(430%) hue-rotate(160deg) brightness(102%) contrast(92%);
  }
  .poseart img[src*="/wg-"]{
    filter:brightness(0) saturate(100%) invert(79%) sepia(23%) saturate(692%) hue-rotate(353deg) brightness(89%) contrast(91%);
  }
  .poseart img+img{margin-top:18px;}
  .posecredit{
    margin:6px auto 0;max-width:340px;font-family:var(--mono);font-size:8px;line-height:1.4;
    color:var(--dim);text-align:center;
  }
  .histbody{border-left:1px solid var(--line);padding:4px 0 2px 13px;margin:2px 0 4px;}
  .histsplit{border-top:1px solid var(--line);margin:12px 0 10px;}
  .histbody .eyebrow{display:block;margin-bottom:7px;}
  .histcap{font-size:var(--s3);color:var(--dim);margin:0 0 8px;line-height:1.45;}
  table.h{border-collapse:collapse;width:100%;max-width:280px;}
  table.h td{font-family:var(--mono);font-size:var(--s3);padding:4px 0;}
  td.w{color:var(--dim);width:64px;}
  td.kg{color:var(--ink);font-weight:400;}
  td.d{text-align:right;color:var(--dim);}
  td.d.up{color:#7FCBA9;}
  td.d.dn{color:#E0899A;}
  [hidden]{display:none!important;}

  /* ---------- plain card (daily · tests · why) ---------- */
  .hab{
    background:var(--fill);border:1px solid var(--line);border-top:0;border-bottom:0;
    border-radius:var(--r);
    padding:16px;margin-bottom:8px;position:relative;overflow:hidden;
  }
  .hab::after{
    content:"";position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
    transform:scaleY(var(--hair));transform-origin:top;
    background:linear-gradient(90deg,transparent 8%,var(--edge) 24%,var(--edge) 76%,transparent 92%);}
  .hab::before{
    content:"";position:absolute;left:0;right:0;bottom:0;height:1px;
    transform:scaleY(var(--hair));transform-origin:bottom;z-index:2;pointer-events:none;
    background:linear-gradient(90deg,transparent 12%,var(--edge2) 29%,var(--edge2) 71%,transparent 88%);}
  .habtop{display:flex;align-items:baseline;gap:10px;}
  .habname{font-size:var(--s1);font-weight:600;letter-spacing:-.015em;flex:1;line-height:1.25;}
  .habdose{font-family:var(--mono);font-size:var(--s4);color:var(--dim);flex:none;white-space:nowrap;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;}
  .gcell{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .gdow{font-family:var(--mono);font-size:var(--s4);color:var(--dim);font-weight:500;}
  .gbox{
    width:100%;height:38px;padding:0;
    border:1px solid #FFFFFF1A;border-radius:var(--rc);background:#FFFFFF05;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s;
  }
  .gbox svg{width:13px;height:13px;fill:none;stroke:#0A0C0D;stroke-width:3.2;opacity:0;transition:opacity .15s;}
  .gbox.on{background:var(--brass);border-color:var(--brass);}
  .gbox.on svg{opacity:1;}
  .gcell.today .gdow{color:var(--ink);}
  .gcell.today .gbox{border-color:var(--muted);}
  .gcell.future .gbox{opacity:.35;}
  .density{font-family:var(--mono);font-size:var(--s4);color:var(--dim);letter-spacing:.02em;
    white-space:nowrap;flex:none;}
  .hab details{margin:12px 0 0;}

  /* ---------- prose blocks ---------- */
  .prbox{
    position:relative;overflow:hidden;
    background:var(--fill);border:1px solid var(--line);border-top:0;border-bottom:0;
    border-radius:var(--r);padding:16px;margin-bottom:8px;
  }
  .prbox::after{
    content:"";position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
    transform:scaleY(var(--hair));transform-origin:top;
    background:linear-gradient(90deg,transparent 8%,var(--edge) 24%,var(--edge) 76%,transparent 92%);}
  .prh{
    display:block;font-family:var(--mono);font-size:var(--s4);font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;color:var(--brass2);margin-bottom:8px;
  }
  .prt{margin:0 0 11px;font-size:var(--s2);line-height:1.7;color:#AEB8BF;}
  .prt:last-child{margin-bottom:0;}
  .prt b{font-weight:600;color:var(--ink);}
  .prt em{font-style:normal;color:var(--brass);font-weight:600;}
  .lead{font-family:var(--serif);font-size:20px;line-height:1.45;color:var(--ink);
    font-weight:600;letter-spacing:-.01em;margin:0 0 12px;}

  table.t{width:100%;border-collapse:collapse;margin:4px 0 2px;}
  table.t td{font-size:var(--s3);line-height:1.55;padding:8px 0;color:#AEB8BF;
    border-top:1px solid var(--line);vertical-align:top;}
  table.t tr:first-child td{border-top:0;}
  table.t td.k{color:var(--ink);font-weight:600;padding-right:12px;width:38%;}
  table.t td.k.no{color:#C98A97;}
  table.t td.k.yes{color:#8FC9AE;}
  table.t b{color:var(--ink);font-weight:600;}

  .fig{margin:6px 0 2px;}
  .fig svg{display:block;width:100%;height:auto;}
  .figcap{font-family:var(--mono);font-size:var(--s4);color:var(--dim);line-height:1.6;
    margin:8px 0 0;text-align:center;}

  /* ---------- tests ---------- */
  .tsrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
  .tsrow:first-of-type{border-top:0;}
  .tslab{flex:1;min-width:0;font-size:var(--s2);font-weight:500;}
  .tssub{display:block;font-size:var(--s4);color:var(--dim);font-weight:400;line-height:1.4;}
  .tsin{width:58px;}
  .pair{display:flex;gap:6px;flex:none;}
  .tgl{
    padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:transparent;
    font:inherit;font-size:var(--s3);font-weight:600;color:var(--muted);cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tgl[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#0A0C0D;}
  .tgl.warn[aria-pressed="true"]{background:#C4677C;border-color:#C4677C;}
  .iorow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .btn{
    padding:9px 14px;border:1px solid var(--brass);border-radius:999px;background:var(--brass);
    color:#0A0C0D;font:inherit;font-size:var(--s3);font-weight:600;cursor:pointer;
  }
  .btn.ghost{background:transparent;color:var(--ink);border-color:#FFFFFF24;}
  .iomsg{font-size:var(--s3);color:var(--muted);margin-top:10px;line-height:1.55;}
  .iomsg b{color:var(--ink);font-weight:600;}
  .flag{border-left:2px solid #C4677C;padding-left:12px;}
  .flag .prh{color:#C4677C;}

  /* ---------- footer / transfer ---------- */
  footer{display:flex;justify-content:flex-end;align-items:flex-start;gap:16px;
    flex-wrap:wrap;margin-top:16px;padding:0 2px;}
  .link{background:none;border:0;padding:8px 2px;font:inherit;font-size:var(--s4);color:#586369;
    cursor:pointer;text-decoration:underline;text-decoration-color:#FFFFFF1F;text-underline-offset:3px;
    transition:color .15s;}
  .link[aria-expanded="true"],.link[aria-pressed="true"]{color:var(--brass);text-decoration-color:var(--brass2);}
  .ver{flex-basis:100%;order:9;font-size:var(--s4);font-weight:400;color:#586369;}
  .io{
    background:var(--fill);border:1px solid var(--line);border-top:0;border-bottom:0;

 {k:'rdl' ,label:'RDL depth ceiling',unit:'cm',sub:'ระยะมือจากพื้น ณ จุดสุดท้ายที่ยังคง lordosis · น้อยลง = ROM ดีขึ้น',step:1,inv:1},

/* ================= state ================= */
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } };

function now(){ const d=new Date(); if(d.getHours()<ROLL_HOUR) d.setDate(d.getDate()-1); return d; }
function dowOf(d){ return (d.getDay()+6)%7; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ym(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function weekKey(d){
  const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  const w1=new Date(t.getFullYear(),0,4);
  const n=1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7);
  return t.getFullYear()+'-W'+String(n).padStart(2,'0');
}
function mondayOf(d){ const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()); t.setDate(t.getDate()-dowOf(t)); return t; }
function addDays(d,n){ const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()); t.setDate(t.getDate()+n); return t; }

const BLANK={wk:weekKey(now()),checks:{},weights:{},slump:false,start:ymd(mondayOf(now())),tests:[]};
let state=BLANK;
function load(){
  let s=null;
  try{ s=JSON.parse(lsGet(KEY)||'null'); }catch(e){ s=null; }
  state=Object.assign({},BLANK,s||{});
  /* shapes are validated, not just defaulted — a string where an object belongs
     turns every later write into a silent no-op */
  if(typeof state.checks!=='object'||!state.checks) state.checks={};
  if(typeof state.weights!=='object'||!state.weights) state.weights={};
  if(!Array.isArray(state.tests)) state.tests=[];
  if(typeof state.start!=='string') state.start=ymd(mondayOf(now()));
}
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(flush,300); }
function flush(){ clearTimeout(saveT); saveT=null; lsSet(KEY,JSON.stringify(state)); }
addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flush(); });
addEventListener('pagehide',flush);

/* ---- history · one shard per year ---- */
let histRecs=[];
function histIndex(){ try{ const a=JSON.parse(lsGet(HIDX)||'[]'); return Array.isArray(a)?[...new Set(a.map(Number))].filter(Boolean):[]; }catch(e){ return []; } }
function loadHist(){
  histRecs=[];
  for(const y of histIndex()){
    try{ const a=JSON.parse(lsGet(HSHARD(y))||'[]'); if(Array.isArray(a)) histRecs.push(...a); }catch(e){}
  }
  histRecs.sort((a,b)=>a.week<b.week?1:-1);
}
function archive(rec){
  const y=Number(rec.week.slice(0,4));
  let a=[]; try{ a=JSON.parse(lsGet(HSHARD(y))||'[]'); if(!Array.isArray(a)) a=[]; }catch(e){}
  if(a.some(r=>r.week===rec.week)) return;
  a.push(rec); lsSet(HSHARD(y),JSON.stringify(a));
  const idx=histIndex(); if(!idx.includes(y)){ idx.push(y); lsSet(HIDX,JSON.stringify(idx)); }
}
/* Weights carry forward between weeks — the field should open showing what she
   lifted last time, not empty. That makes the archive step non-obvious: dumping
   state.weights wholesale would write a full row for a week she skipped, because
   the numbers are still sitting there from a fortnight ago. Only ids that were
   actually TICKED get archived, so a missed week reads as missing. */
function rollover(){
  const cur=weekKey(now());
  if(state.wk===cur) return;
  const done=Object.keys(state.checks);
  if(done.length){
    const w={};
    for(const id of done){ if(state.weights[id]!=null&&state.weights[id]!=='') w[id]=state.weights[id]; }
    archive({week:state.wk,c:Object.assign({},state.checks),w});
  }
  state.wk=cur; state.checks={};
  flush();
}
function lastRecorded(id){ for(const r of histRecs){ const v=r.w&&r.w[id]; if(v!==undefined&&v!==''&&v!=null) return v; } return null; }

/* ---- daily log · one shard per month ---- */
function dayLog(m){ try{ const o=JSON.parse(lsGet(DSHARD(m))||'{}'); return (o&&typeof o==='object')?o:{}; }catch(e){ return {}; } }
function dayGet(dstr,id){ const o=dayLog(dstr.slice(0,7))[dstr]; return !!(o&&o[id]); }
function dayToggle(dstr,id){
  const m=dstr.slice(0,7), o=dayLog(m);
  if(!o[dstr]) o[dstr]={};
  if(o[dstr][id]) delete o[dstr][id]; else o[dstr][id]=1;
  if(!Object.keys(o[dstr]).length) delete o[dstr];
  lsSet(DSHARD(m),JSON.stringify(o));
}
function density(id,days){
  let n=0, t=now();
  const cache={};
  for(let i=0;i<days;i++){
    const d=addDays(t,-i), m=ym(d);
    if(!cache[m]) cache[m]=dayLog(m);
    const o=cache[m][ymd(d)];
    if(o&&o[id]) n++;
  }
  return n;
}

/* ---- phase ---- */
function progWeek(){
  const s=new Date(state.start+'T00:00:00');
  if(isNaN(s)) return 1;
  return Math.max(1,Math.floor((mondayOf(now())-mondayOf(s))/604800000)+1);
}
function phaseOf(w){ return w<=4?1:(w<=12?2:3); }
const PHASE={
 1:{n:'Phase 1 · motor control',t:'สัปดาห์ 1–4 · <b>RDL ใช้บาร์เปล่าหรือดัมเบลเบา</b> · priority คือคุม lordosis ให้ได้สม่ำเสมอจนไม่ต้อง cue ตัวเองทุก rep; น้ำหนักยังไม่ใช่ KPI หลัก'},
 2:{n:'Phase 2 · loading',t:'สัปดาห์ 5–12 · เริ่ม progressive loading ตามกติกาเดิม: <b>เพิ่ม usable depth ก่อน แล้วค่อยเพิ่ม load</b>'},
 3:{n:'Phase 3 · maintain',t:'สัปดาห์ 13+ · Daily Block ลดเหลือ 3 ครั้ง/สัปดาห์ได้ · <b>คง RDL เป็น maintenance lift</b> แทนการหยุดทันทีเมื่ออาการหรือ ROM ดีขึ้น'}
};

/* ================= week tab ================= */
function noteHTML(it){
  let h='';
  if(it.target)  h+='<p class="tl"><span class="lab">Why</span>'+it.target+'</p>';
  if(it.note)    h+='<p class="tn"><span class="lab">How</span>'+it.note+'</p>';
  if(it.art){
    const arts=Array.isArray(it.art)?it.art:[it.art];
    h+='<figure class="poseart">'+arts.map((src,i)=>'<img src="'+esc(src)+'" alt="ภาพสาธิต '+esc(it.name)+(arts.length>1?' '+(i+1):'')+'" loading="lazy">').join('')+'<figcaption class="posecredit">Pose artwork based on Everkinetic, adapted by Bryl Lim (workout-guide), modified</figcaption></figure>';
  }
  if(it.mistake) h+='<p class="tn"><span class="lab">Watch for</span>'+it.mistake+'</p>';
  return h;
}
function histHTML(it){
  if(it.noWeight) return '';
  const rows=[];
  for(const r of histRecs){ const v=r.w&&r.w[it.id]; if(v!==undefined&&v!==''&&v!=null) rows.push({week:r.week,w:Number(v)}); if(rows.length>=8) break; }
  if(!rows.length) return '<p class="histcap">ยังไม่มี history · ระบบจะเริ่มแสดงหลังจบสัปดาห์แรกที่มีการบันทึก</p>';
  let h='<p class="histcap">Weight · last 8 weeks</p><table class="h">';
  for(let i=0;i<rows.length;i++){
    const r=rows[i],p=rows[i+1];
    const d=p?+(r.w-p.w).toFixed(1):null;
    const cls=d==null||d===0?'':(d>0?'up':'dn');
    const txt=d==null?'':(d>0?'+'+d:(d<0?''+d:'—'));
    h+='<tr><td class="w">'+r.week.slice(5)+'</td><td class="kg">'+r.w+' kg</td><td class="d '+cls+'">'+txt+'</td></tr>';
  }
  return h+'</table>';
}
function itemHTML(it,grouped){
  const on=state.checks[it.id]?' on':'';
  let wt='';
  if(!it.noWeight){
    const anchor=lastRecorded(it.id);
    const v=state.weights[it.id]??'';
    wt='<div class="wtwrap"><input class="wtin" type="number" step="0.5" inputmode="decimal" data-wt="'+it.id+'" value="'+esc(v)+'" placeholder="'+(anchor?esc(anchor):'')+'" aria-label="weight in kg, '+esc(it.name)+'"></div>';
  }
  const hist=it.noWeight?'':'<div class="histsplit"></div><div class="histbody"><span class="eyebrow">History</span>'+histHTML(it)+'</div>';
  const ds=String(it.dose).split('·')[0].trim();
  const det='<div class="drop"><p class="dosefull">'+esc(it.dose)+'</p><div class="note">'+noteHTML(it)+'</div>'+hist+'</div>';
  const box=grouped?'':'<button class="box'+on+'" data-check="'+it.id+'" aria-pressed="'+(on?'true':'false')+'" aria-label="'+esc(it.name)+'">'+CHECK+'</button>';
  return '<div class="item'+on+(grouped?' nobox':'')+'" data-item="'+it.id+'">'+box+
    '<span class="txt"><span class="name">'+esc(it.name)+'</span><span class="dose">'+esc(ds)+'</span></span>'+
    wt+'<button class="idet" data-det="'+it.id+'" aria-expanded="false" aria-label="detail, '+esc(it.name)+'">i</button>'+
    '</div>'+det;
}
function dayHTML(day,i){
  const k=KIND[day.kind];
  const isToday=DOWI[day.dow]===dowOf(now());
  let inner='',open=null,buf=[],ids=[];
  const flushG=()=>{ if(!buf.length) return;
    const isSS=open&&ids.length>1;
    const head=(open&&ids.length)
      ? '<div class="grphead"><button class="box" data-gcheck="'+ids.join(',')+'" aria-pressed="false" aria-label="'+(isSS?'block, '+ids.length+' exercises':'tick group')+'">'+CHECK+'</button><p class="sslab">'+(isSS?'block':'')+'</p></div>'
      : '<p class="sslab"></p>';
    inner+='<div class="grp'+(isSS?' ss':'')+'">'+head+buf.join('')+'</div>';
    buf=[];ids=[]; };
  for(const it of day.items){
    if((it.ss||null)!==open){ flushG(); open=it.ss||null; }
    buf.push(itemHTML(it,!!open));
    if(open) ids.push(it.id);
    if(!open) flushG();
  }
  flushG();
  return '<section class="day'+(isToday?' today':'')+'" data-day="'+i+'" style="--accent:'+k.accent+';--soft:'+k.soft+';--tint:'+k.tint+'">'+
    '<button class="head" data-toggle="'+i+'" aria-expanded="false"><span class="stk">'+
      '<span class="dow">'+day.dow+(day.sub?' <span class="sub">'+esc(day.sub)+'</span>':'')+'</span>'+
      '<span class="title">'+esc(day.title)+'</span></span>'+
      '<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg></span>'+
    '</button><span class="prog"><i data-prog="'+i+'"></i></span><div class="body">'+inner+'</div></section>';
}
const daysEl=document.getElementById('days');
function paintGroups(el){
  for(const b of el.querySelectorAll('[data-gcheck]')){
    const ids=b.dataset.gcheck.split(',').filter(Boolean);
    const on=ids.length>0&&ids.every(id=>state.checks[id]);
    b.classList.toggle('on',on);
    b.setAttribute('aria-pressed',on?'true':'false');
  }
}
function markNext(el){
  let found=false;
  for(const g of el.querySelectorAll('.grp')){
    const open=!found&&!!g.querySelector('.box:not(.on)');
    g.classList.toggle('now',open);
    const lab=g.querySelector('.sslab');
    if(lab) lab.textContent=open?'up next':(g.classList.contains('ss')?'block':'');
    if(open) found=true;
  }
}
function sync(i){
  const day=PLAN[i],el=daysEl.querySelector('[data-day="'+i+'"]');
  if(!el) return;
  const n=day.items.filter(it=>state.checks[it.id]).length;
  const bar=el.querySelector('[data-prog="'+i+'"]');
  if(bar) bar.style.width=(day.items.length?n/day.items.length*100:0)+'%';
  paintGroups(el); markNext(el);
  el.classList.toggle('done',n===day.items.length);
}
function autoTick(el,id){
  if(state.checks[id]) return;
  state.checks[id]=true;
  const item=el.closest('.item'); if(!item) return;
  const box=item.querySelector('[data-check]');
  if(box){ box.classList.add('on'); box.setAttribute('aria-pressed','true'); }
  item.classList.add('on');
  const d=el.closest('[data-day]'); if(d) sync(Number(d.dataset.day));
}
function buildWeek(){
  daysEl.innerHTML=PLAN.map(dayHTML).join('');
  PLAN.forEach((_,i)=>sync(i));
  const td=dowOf(now());
  PLAN.forEach((s,i)=>{
    if(DOWI[s.dow]!==td) return;
    const el=daysEl.querySelector('[data-day="'+i+'"]');
    if(el){ el.classList.add('open'); el.querySelector('.head').setAttribute('aria-expanded','true'); }
  });
  const w=progWeek(),p=PHASE[phaseOf(w)];
  document.getElementById('weekno').innerHTML='Week <b>'+w+'</b> · '+esc(p.n.split('·')[1].trim());
  document.getElementById('dailyno').innerHTML='Week <b>'+w+'</b> · '+esc(p.n.split('·')[1].trim());
  document.getElementById('wkintro').innerHTML=
    '<div class="prbox"><span class="prh">'+esc(p.n)+'</span><p class="prt">'+p.t+'</p></div>'+
    (state.slump?'<div class="prbox flag"><span class="prh">Slump positive</span><p class="prt">Slump test ถูกตั้งเป็น positive · <b>ลด intensity ของ Hamstring contract–relax ลงประมาณครึ่งหนึ่ง และหยุดก่อนเกิด neural tension</b> · Sciatic nerve slider จะอยู่ใน Daily · re-test ทุก 2 สัปดาห์; เมื่อ negative ให้ปิดสถานะใน Tests</p></div>':'');
}
daysEl.addEventListener('click',e=>{
  const tg=e.target.closest('[data-toggle]');
  if(tg){
    const el=daysEl.querySelector('[data-day="'+tg.dataset.toggle+'"]');
    tg.setAttribute('aria-expanded',el.classList.toggle('open')?'true':'false');
    return;
  }
  const dt=e.target.closest('[data-det]');
  if(dt){
    const item=dt.closest('.item');
    const open=item.classList.toggle('det');
    dt.setAttribute('aria-expanded',open?'true':'false');
    return;
  }
  const gb=e.target.closest('[data-gcheck]');
  if(gb){
    const ids=gb.dataset.gcheck.split(',').filter(Boolean);
    const to=!ids.every(id=>state.checks[id]);
    for(const id of ids){
      if(to) state.checks[id]=true; else delete state.checks[id];
      const row=daysEl.querySelector('[data-item="'+id+'"]');
      if(row) row.classList.toggle('on',to);
    }
    save(); sync(Number(gb.closest('[data-day]').dataset.day));
    return;
  }
  const cb=e.target.closest('[data-check]');
  if(cb){
    const id=cb.dataset.check;
    const to=!state.checks[id];
    if(to) state.checks[id]=true; else delete state.checks[id];
    cb.classList.toggle('on',to); cb.setAttribute('aria-pressed',to?'true':'false');
    cb.closest('.item').classList.toggle('on',to);
    save(); sync(Number(cb.closest('[data-day]').dataset.day));
  }
});
daysEl.addEventListener('input',e=>{
  const w=e.target.closest('[data-wt]');
  if(!w) return;
  const id=w.dataset.wt;
  if(w.value==='') delete state.weights[id]; else state.weights[id]=w.value;
  /* typing a number IS doing the exercise — never auto-UNticks, because clearing
     a mistyped number must not erase the set */
  if(w.value!=='') autoTick(w,id);
  save();
});

  }).join('')+
  '<div class="prbox"><span class="prh">Why Daily is separate</span>'+
  '<p class="prt">motor control ต้องการ<b>frequency มากกว่า session volume</b> · 10 นาทีที่ทำได้เกือบทุกวันมีค่ากว่า session ยาวแต่ทำไม่สม่ำเสมอสำหรับเป้าหมายนี้ · <b>ถ้าวันไหนมีเวลาเลือกได้อย่างเดียว ให้ทำ Daily Block ก่อน gym session</b></p>'+
  '<p class="prt">order มีเหตุผล: หาและคุม position ก่อน → แล้วค่อยทำ mobility / tissue work · ถ้าทำกลับกัน มีโอกาสใช้ ROM ใหม่ด้วย movement pattern เดิม</p></div>';
}
habEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-hab]');
  if(!b) return;
  dayToggle(b.dataset.d,b.dataset.hab);
  buildDaily();
});

const tstEl=document.getElementById('tests');
let draft={};
function testHistHTML(k,inv){
  const rows=state.tests.filter(r=>r[k]!=null&&r[k]!=='').slice(-8).reverse();
  if(rows.length<1) return '';
  let h='<table class="h">';
  for(let i=0;i<rows.length;i++){
    const r=rows[i],p=rows[i+1];
    const d=p?+(Number(r[k])-Number(p[k])).toFixed(1):null;
    const cls=d==null||d===0?'':((d>0)!==!!inv?'up':'dn');
    const txt=d==null?'':(d>0?'+'+d:''+d);
    h+='<tr><td class="w">'+r.d.slice(5)+'</td><td class="kg">'+r[k]+'</td><td class="d '+cls+'">'+txt+'</td></tr>';
  }
  return h+'</table>';

    rows+
    '<div class="iorow"><button class="btn" id="tsave">บันทึกผลวันนี้</button>'+
      '<button class="btn ghost" id="tclear">ล้างช่อง</button></div>'+
    (hist?'<details open style="margin-top:14px"><summary>History</summary><div class="histbody">'+hist+'</div></details>':'')+
  '</section>'+

  '<section class="hab"><div class="habtop"><span class="habname">Slump test</span></div>'+
    '<p class="prt" style="margin:8px 0 12px;font-size:var(--s3)">ใช้ SLR/Slump + neural sensitizer เช่น ankle dorsiflexion หรือ cervical flexion · <b>ถ้าอาการเปลี่ยนชัดตาม sensitizer ให้ treat เป็น sciatic neural tension มากกว่า hamstring shortness</b></p>'+
    '<div class="tsrow"><span class="tslab">ผลตรวจล่าสุด<span class="tssub">positive → แสดง nerve slider ใน Daily + ลด intensity ของ hamstring mobility</span></span>'+
      '<span class="pair"><button class="tgl warn" id="slumpon" aria-pressed="'+(state.slump?'true':'false')+'">positive</button>'+
      '<button class="tgl" id="slumpoff" aria-pressed="'+(state.slump?'false':'true')+'">negative</button></span></div>'+
  '</section>'+

  '<section class="hab"><div class="habtop"><span class="habname">Program start</span></div>'+
    '<p class="prt" style="margin:8px 0 10px;font-size:var(--s3)">กำหนด program week/phase · เลือกวันจันทร์ของสัปดาห์ที่เริ่มจริง</p>'+
    '<div class="tsrow"><span class="tslab">วันเริ่ม</span>'+
      '<input class="wtin" style="width:130px" type="date" id="startd" value="'+esc(state.start)+'" aria-label="program start date"></div>'+
  '</section>'+

  '<section class="prbox flag"><span class="prh">Red flags · stop &amp; reassess</span>'+
    '<p class="prt">ปวดร้าวลงต่ำกว่าเข่า · ชา · อ่อนแรง · หรืออาการแย่ลงชัดเจนหลังทำโปรแกรมไป 2 สัปดาห์<br>'+
    '<b>muscle soreness หลังเริ่มท่าใหม่พบได้</b> แต่ neurological symptoms ควรหยุดโปรแกรมและประเมินกับ PT / spine clinician</p></section>';
}
tstEl.addEventListener('input',e=>{
  const t=e.target.closest('[data-ts]');
  if(t){ draft[t.dataset.ts]=t.value; return; }
  if(e.target.id==='startd'){ state.start=e.target.value||ymd(mondayOf(now())); save(); buildWeek(); }
});
tstEl.addEventListener('click',e=>{
  if(e.target.id==='tsave'){
    const rec={d:ymd(now())};
    let any=false;
    for(const t of TESTS){ const v=draft[t.k]; if(v!=null&&v!==''){ rec[t.k]=Number(v); any=true; } }
    if(!any) return;
    rec.slump=!!state.slump;
    /* one row per day: re-saving the same day corrects it rather than stacking */
    state.tests=state.tests.filter(r=>r.d!==rec.d);
    state.tests.push(rec); state.tests.sort((a,b)=>a.d<b.d?-1:1);
    draft={}; flush(); buildTests(); return;
  }
  if(e.target.id==='tclear'){ draft={}; buildTests(); return; }
  if(e.target.id==='slumpon'||e.target.id==='slumpoff'){
    state.slump=e.target.id==='slumpon';
    flush(); buildTests(); buildDaily(); buildWeek(); return;
  }
});

const ioEl=document.getElementById('io');
function buildDump(){
  const d={v:APP_VERSION,at:new Date().toISOString(),state,hist:{},daily:{}};
  for(const y of histIndex()){ const s=lsGet(HSHARD(y)); if(s) d.hist[y]=s; }
  for(let i=0;i<24;i++){
    const t=now(),m=new Date(t.getFullYear(),t.getMonth()-i,1),k=ym(m);
    const s=lsGet(DSHARD(k)); if(s) d.daily[k]=s;
  }
  return JSON.stringify(d);
}
function openIO(mode){
  ioEl.hidden=false;
  const exp=mode==='export';
  ioEl.innerHTML='<div class="iohead"><span class="eyebrow">'+(exp?'Export':'Import')+'</span></div>'+
    '<textarea class="iota" id="iota" spellcheck="false">'+(exp?esc(buildDump()):'')+'</textarea>'+
    '<div class="iorow">'+(exp?'<button class="btn" id="iocopy">คัดลอก</button>':'<button class="btn" id="iorun">นำเข้า (ทับของเดิม)</button>')+
    '<button class="btn ghost" id="ioclose">ปิด</button></div><p class="iomsg" id="iomsg"></p>';
  if(exp) document.getElementById('iota').select();
}
ioEl.addEventListener('click',e=>{
  if(e.target.id==='ioclose'){ ioEl.hidden=true; ioEl.innerHTML=''; for(const b of ['export','import']) document.getElementById(b).setAttribute('aria-expanded','false'); return; }
  if(e.target.id==='iocopy'){
    const ta=document.getElementById('iota'); ta.select();
    try{ document.execCommand('copy'); document.getElementById('iomsg').innerHTML='<b>คัดลอกแล้ว</b>'; }
    catch(err){ document.getElementById('iomsg').textContent='คัดลอกอัตโนมัติไม่ได้ — เลือกทั้งหมดแล้วคัดลอกเอง'; }
    return;
  }
  if(e.target.id==='iorun'){
    const msg=document.getElementById('iomsg');
    let d=null;
    try{ d=JSON.parse(document.getElementById('iota').value); }catch(err){ msg.textContent='อ่าน JSON ไม่ได้'; return; }
    if(!d||typeof d!=='object'||!d.state){ msg.textContent='ไม่ใช่ไฟล์ export ของแอปนี้'; return; }
    lsSet(KEY,JSON.stringify(d.state));
    const yrs=[];
    for(const y in (d.hist||{})){ lsSet(HSHARD(y),d.hist[y]); yrs.push(Number(y)); }
    if(yrs.length) lsSet(HIDX,JSON.stringify([...new Set(yrs)]));
    for(const m in (d.daily||{})) lsSet(DSHARD(m),d.daily[m]);
    msg.innerHTML='<b>นำเข้าแล้ว</b> — กำลังโหลดใหม่';
    setTimeout(()=>location.reload(),400);
  }
});
for(const id of ['export','import']){
  document.getElementById(id).addEventListener('click',e=>{
    const open=e.target.getAttribute('aria-expanded')!=='true';
    for(const b of ['export','import']) document.getElementById(b).setAttribute('aria-expanded','false');
    if(!open){ ioEl.hidden=true; ioEl.innerHTML=''; return; }
    e.target.setAttribute('aria-expanded','true');
    openIO(id);
  });
}

).join('');
function showTab(id){
  for(const t of TABS){
    const on=t.id===id;
    document.getElementById('tab-'+t.id).setAttribute('aria-selected',on?'true':'false');
    document.getElementById(t.pane).classList.toggle('on',on);

  lsSet(UITAB,id);
  try{ scrollTo(0,0); }catch(e){}
}
tabsEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]');
  if(b) showTab(b.dataset.tab);
});
